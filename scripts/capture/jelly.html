<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Original Opus jelly · README capture</title></head>
<body><canvas id="surface"></canvas><p id="status">Ready to render the original Opus jelly.</p>
<script type="module">
import { captureBases } from './base.js';
window.captureCurrentBases = async () => {
 const sources=[];
 for(const name of ['header','activity','tile-1','tile-2','tile-3','tile-4','stack'])for(const v of [name,`d-${name}`])sources.push({name:v,url:`/assets/${v}.svg`});
 const result=await captureBases(sources);
 for(const image of result){const blob=await (await fetch(image.data)).blob();const response=await fetch(`/frame/base-${image.name}/000`,{method:'POST',body:blob});if(!response.ok)throw new Error('Could not write base '+image.name);}
 return result.map(({name})=>name);
};
import { Jelly } from '../vendor/opus-jelly/jelly.js';
import { createContext } from '../vendor/opus-jelly/gl.js';
const canvas = document.querySelector('canvas');
const gl = createContext(canvas);
if (!gl) throw new Error('WebGL2 is required to capture the original jelly.');
let sim;
window.recordJelly = async function({name,w,h,dpr=1.5,frames=84,fps=12}) {
  if (sim) sim.dispose();
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  gl.viewport(0,0,canvas.width,canvas.height);
  const markTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,markTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  sim=new Jelly(gl,{w,h,dpr,reduced:false,compact:w<700||h<460,markTex});
  const idle={ax:0,ay:0,bx:0,by:0,down:false,hover:false,pressed:false,moved:false};
  const blank=document.createElement('canvas');blank.width=canvas.width;blank.height=canvas.height;
  const composite=blank.getContext('2d');
  let pressed=false,opened=false,reset=false;
  let ax=w*.22,ay=h*.5;
  for(let i=0;i<frames;i++) {
    // Scripted pointer gestures drive the original simulation at 60 Hz.
    for(let sub=0;sub<5;sub++) {
      const t=(i*5+sub)/60;
      let inp={...idle};
      if(t>.25&&t<1.25) {
        const bx=w*(.2+.55*(t-.25)),by=h*(.5+Math.sin(t*5)*.12);
        inp={ax,ay,bx,by,hover:true,down:false,pressed:false,moved:true};ax=bx;ay=by;
      } else if(t>=1.4&&t<2.7) {
        const q=(t-1.4)/1.3;
        const bx=w*(.38+.36*q),by=h*(.5-.12*Math.sin(q*Math.PI));
        inp={ax,ay,bx,by,down:true,hover:false,pressed:!pressed,moved:true};pressed=true;ax=bx;ay=by;
      }
      if(t>=2.7&&!opened) {sim.release();sim.open({x:w*.14,y:h*.09,w:w*.72,h:h*.82});opened=true;}
      if(t>=4.9&&!reset) {sim.reset();reset=true;}
      sim.step(1/60,inp);
    }
    sim.render();
    composite.clearRect(0,0,blank.width,blank.height);
    composite.drawImage(canvas,0,0);
    const blob=await new Promise(resolve=>blank.toBlob(resolve,'image/png'));
    const response=await fetch(`/frame/${name}/${String(i).padStart(3,'0')}`,{method:'POST',body:blob});
    if(!response.ok)throw new Error('Frame write failed: '+response.status);
    document.querySelector('#status').textContent=`${name}: ${i+1}/${frames}`;
  }
  gl.deleteTexture(markTex);
  return {name,w,h,width:canvas.width,height:canvas.height,frames,renderer:'original Opus Jelly',glError:gl.getError()};
};
</script></body></html>
