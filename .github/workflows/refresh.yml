name: Refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build README and SVGs from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py
      - name: Commit if anything changed
        run: |
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          # Another run may have pushed since checkout: commit these outputs on top of
          # the latest main instead of failing. They are generated, so ours win.
          git fetch origin main
          git reset --soft origin/main
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push origin HEAD:main
